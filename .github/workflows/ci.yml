# Continuous integration for PersistentQueue
# - host tests (tests/host) with AddressSanitizer and UndefinedBehaviorSanitizer,
#   against a model of the arduino-esp32 FS API: SPIFFS, LittleFS and the IDF 3.x core
# - example sketches compiled on arduino-esp32 3.x (ESP32, ESP32-S3, ESP32-C3),
#   2.0.17 and 1.0.6 (IDF 3.x, SPIFFS only: the 1.0.x cores have no LittleFS)
# - Arduino Lint (the library is already in the Library Manager: update checks)

name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (${{ matrix.compiler }}, ${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        std: [gnu++11, c++17, c++20]
    steps:
      - uses: actions/checkout@v7
      - name: Build and run
        run: make -C tests/host CXX=${{ matrix.compiler }} STD=${{ matrix.std }}

  examples:
    name: Examples (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core 3.x, ESP32, SPIFFS
            fqbn: esp32:esp32:esp32
            core: ""
            sketches: |
              - examples/SPIFFS_Example
              - examples/StoreAndForward
              - examples/SharedFolder
            flags: ""
          - name: core 3.x, ESP32, LittleFS
            fqbn: esp32:esp32:esp32
            core: ""
            sketches: |
              - examples/LittleFS_Example
            flags: "-DPQ_USES_LITTLEFS"
          - name: core 3.x, ESP32-S3, SPIFFS
            fqbn: esp32:esp32:esp32s3
            core: ""
            sketches: |
              - examples/SPIFFS_Example
              - examples/StoreAndForward
              - examples/SharedFolder
            flags: ""
          - name: core 3.x, ESP32-C3, SPIFFS
            fqbn: esp32:esp32:esp32c3
            core: ""
            sketches: |
              - examples/SPIFFS_Example
              - examples/StoreAndForward
              - examples/SharedFolder
            flags: ""
          - name: core 3.x, ESP32-C3, LittleFS
            fqbn: esp32:esp32:esp32c3
            core: ""
            sketches: |
              - examples/LittleFS_Example
            flags: "-DPQ_USES_LITTLEFS"
          - name: core 2.0.17, ESP32, SPIFFS
            fqbn: esp32:esp32:esp32
            core: "2.0.17"
            sketches: |
              - examples/SPIFFS_Example
              - examples/StoreAndForward
              - examples/SharedFolder
            flags: ""
          - name: core 2.0.17, ESP32, LittleFS
            fqbn: esp32:esp32:esp32
            core: "2.0.17"
            sketches: |
              - examples/LittleFS_Example
            flags: "-DPQ_USES_LITTLEFS"
          - name: core 1.0.6, ESP32, SPIFFS
            fqbn: esp32:esp32:esp32
            core: "1.0.6"
            sketches: |
              - examples/SPIFFS_Example
              - examples/StoreAndForward
              - examples/SharedFolder
            flags: ""
    steps:
      - uses: actions/checkout@v7
      # core 1.0.6 calls "python" and needs pyserial for its esptool and partition scripts
      - name: Python for core 1.0.6
        if: matrix.core == '1.0.6'
        run: sudo apt-get update && sudo apt-get install -y python-is-python3 python3-serial
      - name: Latest core
        if: matrix.core == ''
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: ${{ matrix.sketches }}
          cli-compile-flags: |
            - --build-property
            - compiler.cpp.extra_flags=${{ matrix.flags }}
            - --warnings
            - all
      - name: Pinned core ${{ matrix.core }}
        if: matrix.core != ''
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: ${{ matrix.sketches }}
          cli-compile-flags: |
            - --build-property
            - compiler.cpp.extra_flags=${{ matrix.flags }}
            - --warnings
            - all

  lint:
    name: Arduino Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/arduino-lint-action@v3
        with:
          project-type: library
          library-manager: update
