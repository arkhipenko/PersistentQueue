sentence=Implementation of a queue that persists messages to flash.
paragraph=Each message is a file on SPIFFS or LittleFS, so the queue survives a reset or power loss. Messages are retrieved oldest first or newest first. Supports peek and drop for at-least-once delivery and an optional message limit. ESP32 (arduino-esp32).
